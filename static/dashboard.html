<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - CodeQuest</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
        }
        h3 { color: #2980b9; margin-top: 0; }
        .card.professor h3 { color: #8e44ad; }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-aluno { background-color: #2980b9; }
        .btn-professor { background-color: #8e44ad; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="header">
    <h2>🚀 CodeQuest - Plataforma de Lógica</h2>
    <button onclick="window.location.href='index.html'" style="width: auto; background: #e74c3c;">Sair</button>
</div>

<div class="container">
    <!-- ÁREA DO PROFESSOR -->
    <div class="card professor">
        <h3>Área do Professor</h3>
        <p>Crie uma nova turma para os seus alunos.</p>
        <form id="formTurma">
            <input type="text" id="nomeTurma" placeholder="Nome da Turma (Ex: Lógica 101)" required>
            <input type="text" id="codigoTurma" placeholder="Código de Acesso (Ex: PROG2026)" required>
            <!-- Simulamos o ID do professor 1 para simplificar o MVP -->
            <input type="hidden" id="professorId" value="1">
            <button type="submit" class="btn-professor">Criar Turma</button>
        </form>
    </div>

    <!-- ÁREA DO ALUNO -->
    <div class="card">
        <h3>Área do Aluno</h3>
        <p>Insira o código fornecido pelo seu professor.</p>
        <form id="formEntrarTurma">
            <input type="text" id="codigoAcessoAluno" placeholder="Código da Turma" required>
            <button type="submit" class="btn-aluno">Entrar na Turma</button>
        </form>
    </div>
</div>

<script>
    // Lógica para o Professor criar Turma
    document.getElementById('formTurma').addEventListener('submit', function(e) {
        e.preventDefault();
        const turma = {
            nome: document.getElementById('nomeTurma').value,
            codigoAcesso: document.getElementById('codigoTurma').value,
            professorId: document.getElementById('professorId').value
        };

        fetch('http://localhost:8080/api/turmas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(turma)
        })
        .then(response => response.json())
        .then(data => alert('Turma ' + data.nome + ' criada com sucesso!'))
        .catch(error => console.error('Erro:', error));
    });

    // Lógica para o Aluno entrar na Turma
    document.getElementById('formEntrarTurma').addEventListener('submit', function(e) {
        e.preventDefault();
        const codigo = document.getElementById('codigoAcessoAluno').value;
        alert('A procurar pela turma com código: ' + codigo + '...\n(No MVP, isto redirecionaria para as questões da turma!)');
    });
</script>

</body>
</html>
