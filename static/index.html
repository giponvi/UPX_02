<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - MVP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #2c3e50; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { background-color: #219150; }
        .logo { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🚀</div>
    <h2>CodeQuest</h2>
    <p>Crie a sua conta para começar</p>

    <form id="formCadastro">
        <input type="text" id="nome" placeholder="Seu Nome" required>
        <input type="email" id="email" placeholder="Seu E-mail" required>
        <input type="password" id="senha" placeholder="Sua Senha" required>
        <select id="perfil">
            <option value="ALUNO">Sou Aluno</option>
            <option value="PROFESSOR">Sou Professor</option>
        </select>
        <button type="submit">Cadastrar e Entrar</button>
    </form>
</div>

<script>
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita que a página recarregue

        // Pega os dados que o utilizador digitou
        const usuario = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
            perfil: document.getElementById('perfil').value
        };

        // Envia para o nosso Backend Spring Boot!
        fetch('http://localhost:8080/api/usuarios', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(usuario)
        })
        .then(response => response.json())
        .then(data => {
            alert('Conta criada com sucesso, ' + data.nome + '!');
            window.location.href = 'dashboard.html';
        })
        .catch(error => {
            alert('Erro ao criar conta. Verifique o servidor.');
            console.error(error);
        });
    });
</script>

</body>
</html>
