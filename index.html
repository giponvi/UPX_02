<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest - Acesso</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 5px; }

        /* Estilo das Abas (Tabs) */
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-size: 16px; color: #7f8c8d; cursor: pointer; font-weight: bold; padding: 5px 10px; }
        .tab-btn.active { color: #27ae60; border-bottom: 3px solid #27ae60; }

        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-submit { background-color: #27ae60; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background-color: #219150; }
        .logo { font-size: 40px; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🚀</div>
    <h2>CodeQuest</h2>
    <p style="color: #7f8c8d; margin-top: 0;">Plataforma de Lógica Gamificada</p>

    <!-- ABAS -->
    <div class="tabs">
        <button class="tab-btn active" id="btnTabLogin" onclick="mudarAba('login')">Entrar</button>
        <button class="tab-btn" id="btnTabCadastro" onclick="mudarAba('cadastro')">Criar Conta</button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="formLogin">
        <input type="email" id="loginEmail" placeholder="Seu E-mail" required>
        <input type="password" id="loginSenha" placeholder="Sua Senha" required>
        <button type="submit" class="btn-submit">Entrar na Plataforma</button>
    </form>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form id="formCadastro" class="hidden">
        <input type="text" id="cadNome" placeholder="Seu Nome Completo" required>
        <input type="email" id="cadEmail" placeholder="Seu E-mail" required>
        <input type="password" id="cadSenha" placeholder="Crie uma Senha" required>
        <select id="cadPerfil" required>
            <option value="" disabled selected>Selecione seu perfil...</option>
            <option value="ALUNO">Sou Aluno (Aprender)</option>
            <option value="PROFESSOR">Sou Professor (Ensinar)</option>
        </select>
        <button type="submit" class="btn-submit" style="background-color: #2980b9;">Cadastrar e Entrar</button>
    </form>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/usuarios';

    if (localStorage.getItem("usuarioSessao")) {
        window.location.replace("dashboard.html");
    }

    function mudarAba(aba) {
        document.getElementById('formLogin').classList.toggle('hidden', aba !== 'login');
        document.getElementById('formCadastro').classList.toggle('hidden', aba !== 'cadastro');
        document.getElementById('btnTabLogin').classList.toggle('active', aba === 'login');
        document.getElementById('btnTabCadastro').classList.toggle('active', aba === 'cadastro');
    }

    // LÓGICA DE LOGIN
    document.getElementById('formLogin').addEventListener('submit', function(e) {
        e.preventDefault();
        const dadosLogin = {
            email: document.getElementById('loginEmail').value,
            senha: document.getElementById('loginSenha').value
        };

        fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dadosLogin)
        })
        .then(res => {
            if (res.status === 401) throw new Error("E-mail ou senha incorretos!");
            if (!res.ok) throw new Error("Erro no servidor.");
            return res.json();
        })
        .then(usuario => {
            localStorage.setItem('usuarioSessao', JSON.stringify(usuario));
            window.location.replace('dashboard.html');
        })
        .catch(err => alert(err.message));
    });

    // LÓGICA DE CADASTRO
    document.getElementById('formCadastro').addEventListener('submit', function(e) {
        e.preventDefault();
        const novoUsuario = {
            nome: document.getElementById('cadNome').value,
            email: document.getElementById('cadEmail').value,
            senha: document.getElementById('cadSenha').value,
            perfil: document.getElementById('cadPerfil').value
        };

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(novoUsuario)
        })
        .then(res => res.json())
        .then(usuarioSalvo => {
            alert("Conta criada com sucesso!");
            // Já loga o usuário automaticamente após cadastrar
            localStorage.setItem('usuarioSessao', JSON.stringify(usuarioSalvo));
            window.location.replace('dashboard.html');
        })
        .catch(err => alert("Erro ao criar conta."));
    });
</script>

</body>
</html>
